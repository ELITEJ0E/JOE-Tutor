<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff2f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JOE Tutor" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="JOE Tutor - Learn Brighter Together with real-time AI language tutors" />
    <link rel="stylesheet" href="/index.css" />
    <title>JOE Tutor - Learn Brighter Together</title>
    <script>
      window.process = {
        env: {
          API_KEY: "{{API_KEY}}"
        }
      };
      // Suppress benign Vite HMR errors that clutter the console in this environment
      const originalError = console.error;
      const originalWarn = console.warn;
      
      const isBenignViteError = (msg) => {
        if (typeof msg !== 'string') return false;
        return msg.includes('[vite] failed to connect to websocket') || 
               msg.includes('WebSocket closed without opened') ||
               msg.includes('[vite] server connection lost');
      };

      console.error = (...args) => {
        if (isBenignViteError(args[0])) return;
        originalError.apply(console, args);
      };
      
      console.warn = (...args) => {
        if (isBenignViteError(args[0])) return;
        originalWarn.apply(console, args);
      };

      window.addEventListener('unhandledrejection', (event) => {
        if (isBenignViteError(event.reason) || isBenignViteError(event.reason?.message)) {
          event.preventDefault();
        }
      });
    </script>
    <script>
      MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        options: {
          ignoreHtmlClass: 'mathjax_ignore',
          processHtmlClass: 'mathjax_process'
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <!-- MathJax is self-hosted and loaded on demand only for math expressions. -->

</head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
