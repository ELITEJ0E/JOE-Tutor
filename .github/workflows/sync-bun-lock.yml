name: Synchronize Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/sync-bun-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bun-lock-main
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Bun used by Cloudflare
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Regenerate lockfile from package.json
        run: bun install --lockfile-only
      - name: Validate frozen installation
        run: bun install --frozen-lockfile
      - name: Commit updated bun.lock
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: synchronize bun.lock with package.json"
          git push origin HEAD:main
