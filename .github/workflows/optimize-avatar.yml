name: Optimize free avatar model

on:
  push:
    branches: [feat/integrated-free-webgl-avatar]
    paths: ['.github/workflows/optimize-avatar.yml']

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download CC0 source avatar
        run: |
          mkdir -p public/models
          curl -fL --retry 3 --max-time 240 -o /tmp/mei-mpfb-original.glb https://raw.githubusercontent.com/met4citizen/TalkingHead/main/avatars/mpfb.glb
          ls -lh /tmp/mei-mpfb-original.glb
      - name: Optimize textures and geometry
        run: |
          npx --yes @gltf-transform/cli@4.4.2 optimize /tmp/mei-mpfb-original.glb public/models/mei-mpfb-cc0.glb --compress meshopt --texture-compress webp --texture-size 1024
          ls -lh public/models/mei-mpfb-cc0.glb
          test "$(stat -c %s public/models/mei-mpfb-cc0.glb)" -lt 35000000
      - name: Save optimized avatar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/mei-mpfb-cc0.glb
          git commit -m 'assets: bundle optimized CC0 Mei human avatar'
          git fetch origin feat/integrated-free-webgl-avatar
          git rebase origin/feat/integrated-free-webgl-avatar
          git push origin HEAD:feat/integrated-free-webgl-avatar
