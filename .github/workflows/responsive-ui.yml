name: Responsive UI Browser QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install chromium --with-deps
      - name: Build UI with nonfunctional test key
        run: GEMINI_API_KEY=test_dummy_key npm run build
      - name: Launch preview and check six viewports
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/joe-tutor-preview.log 2>&1 &
          PREVIEW_URL=http://127.0.0.1:4173 node scripts/check-responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: responsive-screenshots/
          if-no-files-found: ignore
